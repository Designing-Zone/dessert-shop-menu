{% load i18n static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{{ LANGUAGE_BIDI|yesno:'rtl,ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% trans "Dashboard" %}{% endblock %} — Dessert Shop</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f7f6">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <script>(function(){try{var t=localStorage.getItem("dessert-shop-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
</head>
<body class="db-body">
{% block body %}{% endblock %}
<script src="{% static 'js/theme.js' %}" defer></script>
<script src="{% static 'js/dashboard.js' %}" defer></script>
</body>
</html>
